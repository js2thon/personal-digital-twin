[project]
name = "personal-digital-twin"
version = "0.1.0"
description = "Personal Digital Twin Platform - 私有化个人数字分身平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "python-multipart>=0.0.9",
    # 文档解析适配层（内置兜底，缺失时自动降级，不阻塞蒸馏）
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "rdflib>=7.0",  # RDF/OWL/TTL 本体解析与静态质量检查
    "PyMySQL>=1.1",  # 企业 MySQL 只读连接器驱动
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# 高精度解析引擎（可选）：MinerU CLI / docling / opendataloader-pdf(需 Java 11+)
parsers = ["docling>=2.0", "opendataloader-pdf>=2.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
