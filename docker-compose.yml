# Personal Digital Twin Platform - 私有化部署编排
# 基础设施层：PostgreSQL(pgvector) / Redis / MinIO / RAGFlow(可选 profile) / vLLM(可选 profile)
# 说明：RAGFlow 1.0 依赖服务由官方部署方案管理，此处仅通过外部网络对接，不混用其内部组件。

name: personal-digital-twin

services:
  # ---------- 数据域 ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: twin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-personal_twin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data_net]

  redis:
    image: redis:7-alpine
    container_name: twin-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [data_net]

  minio:
    image: minio/minio:latest
    container_name: twin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [data_net]

  # ---------- AI 域（可选：--profile ai）----------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: twin-vllm
    profiles: ["ai"]
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      --served-model-name ${VLLM_SERVED_MODEL:-qwen}
      --max-model-len 16384
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [ai_net]

  # RAGFlow 1.0 建议按官方 docker-compose 部署（固定 v1.0.0 版本），
  # 通过 RAGFLOW_BASE_URL 环境变量经 RAGFlow Adapter 调用其 HTTP API。
  # 不要修改 RAGFlow 内部数据库，也不要将其内部队列与自建 Redis 混用。

  # ---------- 应用域 ----------
  twin-api:
    build:
      context: ./backend
    container_name: twin-api
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-personal_twin}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set a strong MINIO_ROOT_PASSWORD in .env}
      API_KEY: ${API_KEY:?Set a strong API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-empty}
      LLM_MODEL: ${VLLM_SERVED_MODEL:-qwen}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://vllm:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
    ports:
      - "${API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app_net, data_net, ai_net]

  twin-worker:
    build:
      context: ./backend
    container_name: twin-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app_net, data_net, ai_net]

  twin-web:
    image: nginx:alpine
    container_name: twin-web
    ports:
      - "${WEB_PORT:-8200}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on: [twin-api]
    networks: [app_net]

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  data_net:
    internal: false   # 数据服务仅绑定宿主机回环端口；容器间通过私有网络访问
  ai_net:
  app_net:
