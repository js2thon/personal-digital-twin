name: ontology-app-studio
on:
  push:
    branches: [feat/ontology-app-workbench-v1]
    paths:
      - "web/ontology-app-studio/**"
      - "web/ontology-design/index.html"
      - "docs/ontology-app-studio.md"
      - ".github/workflows/ontology-app-studio.yml"
  pull_request:
    paths:
      - "web/ontology-app-studio/**"
      - "web/ontology-design/index.html"
      - "docs/ontology-app-studio.md"
      - ".github/workflows/ontology-app-studio.yml"
jobs:
  static-ui-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate workbench JavaScript, DOM and backend API contracts
        run: node web/ontology-app-studio/validate.mjs
      - name: Install Playwright
        run: npm install --prefix /tmp/ontology-app-e2e --no-save playwright@1.56.1
      - name: Install Chromium
        run: /tmp/ontology-app-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser/API contract E2E
        env:
          PLAYWRIGHT_MODULE: /tmp/ontology-app-e2e/node_modules/playwright
        run: node web/ontology-app-studio/e2e.cjs
