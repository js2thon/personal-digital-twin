name: ontology-quality-and-mapping-tests

on:
  pull_request:
    paths:
      - "backend/app/modules/ontology/**"
      - "backend/app/modules/evaluation/**"
      - "backend/app/api/v1/evaluation.py"
      - "backend/tests/evaluation/**"
      - "backend/app/api/v1/ontology_modelling.py"
      - "backend/app/api/v1/ontology.py"
      - "backend/app/api/v1/lineage.py"
      - "backend/tests/test_fact_lineage_trace.py"
      - "backend/tests/test_rdf_quality.py"
      - "backend/tests/test_ontology_mapping_*.py"
      - "backend/tests/test_mapping_contract.py"
      - "backend/tests/test_ontology_mapping_impact.py"
      - "backend/tests/test_ontology_dataset_preview.py"
      - "backend/tests/test_database_connector.py"
      - "backend/tests/test_database_connector_integration.py"
      - "backend/tests/test_ontology_ingestion_namespace_integration.py"
      - "backend/tests/test_automodel_discovery_boundary.py"
      - "backend/tests/test_automodel_tenant_isolation.py"
      - "backend/tests/test_ontology_ingestion_batches.py"
      - "backend/app/modules/ontology/ingestion_batches.py"
      - "backend/tests/test_automodel_pipeline_hardening.py"
      - "backend/tests/test_business_object_model.py"
      - "backend/tests/test_studio_v2_canvas.py"
      - "backend/tests/test_automodel_metadata_overrides.py"
      - "backend/tests/test_automodel.py"
      - "backend/tests/test_ontology_qa_provenance.py"
      - "backend/pyproject.toml"
      - ".github/workflows/ontology-quality-mapping.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/modules/ontology/**"
      - "backend/app/api/v1/ontology_modelling.py"
      - "backend/app/api/v1/ontology.py"
      - "backend/tests/test_rdf_quality.py"
      - "backend/tests/test_ontology_mapping_*.py"
      - "backend/tests/test_ontology_dataset_preview.py"
      - "backend/tests/test_database_connector.py"
      - "backend/tests/test_database_connector_integration.py"
      - "backend/tests/test_ontology_ingestion_namespace_integration.py"
      - "backend/tests/test_automodel_discovery_boundary.py"
      - "backend/tests/test_automodel_tenant_isolation.py"
      - "backend/pyproject.toml"

jobs:
  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ontology_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ontology_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ontology_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run live database connector integration tests
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ontology_test
          MYSQL_TEST_URL: mysql+pymysql://root:root@127.0.0.1:3306/ontology_test
          TWIN_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: >-
          python -m pytest -q
          tests/test_database_connector_integration.py
          tests/test_ontology_ingestion_namespace_integration.py

  ontology-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run ontology quality and mapping tests
        env:
          APP_ENV: dev
          CQ_V2_STORE: memory
          SHACL_MODE: warn
        run: >-
          python -m pytest -q
          tests/test_rdf_quality.py
          tests/test_ontology_mapping_pipeline.py
          tests/test_mapping_contract.py
          tests/test_ontology_mapping_impact.py
          tests/test_ontology_dataset_preview.py
          tests/test_ontology_mapping_execution.py
          tests/test_database_connector.py
          tests/test_database_connector_integration.py
          tests/test_automodel_discovery_boundary.py
          tests/test_automodel_tenant_isolation.py
          tests/test_automodel_pipeline_hardening.py
          tests/test_business_object_model.py
          tests/test_studio_v2_canvas.py
          tests/test_automodel_metadata_overrides.py
          tests/test_ontology_ingestion_batches.py
          tests/test_ontology_qa_provenance.py
          tests/test_fact_lineage_trace.py
          tests/evaluation/test_ontology_qa_eval.py
      - name: Run relation mapping contract regression tests
        env:
          APP_ENV: dev
        run: >-
          python -m pytest -q tests/test_automodel.py
          -k "relation_contract_rejects_wrong_foreign_key_endpoint or junction_contract_rejects_wrong_endpoint_column"
