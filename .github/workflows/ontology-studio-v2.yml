name: Ontology Studio V2
on:
  pull_request:
    paths:
      - "web/ontology-studio/**"
      - "backend/app/modules/ontology/automodel/**"
      - "backend/app/api/v1/automodel.py"
      - "backend/tests/test_automodel.py"
      - ".github/workflows/ontology-studio-v2.yml"
  push:
    branches: [main]
    paths:
      - "web/ontology-studio/**"
      - "backend/app/modules/ontology/automodel/**"
      - "backend/app/api/v1/automodel.py"
      - "backend/tests/test_automodel.py"
      - ".github/workflows/ontology-studio-v2.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node web/ontology-studio/validate.mjs

  backend-governance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: python -m pip install --upgrade pip && python -m pip install pytest pandas numpy fastapi pydantic pydantic-settings python-multipart pyyaml rdflib sqlalchemy psycopg2-binary
      - name: Run automodel and governance regression tests
        run: python -m pytest tests/test_automodel.py -q
      - name: Compile changed Python modules
        run: python -m compileall -q app/modules/ontology/automodel app/api/v1/automodel.py
