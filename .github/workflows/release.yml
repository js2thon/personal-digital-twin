name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish as GitHub Release (e.g. v0.2.0-no-cognition)"
        required: true

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TITLE="$TAG"
          NOTES="Automated release for \`${TAG}\`.

          ## Included
          - Backend API (FastAPI)
          - Web console
          - Docker image: \`ghcr.io/${{ github.repository_owner }}/personal-digital-twin/twin-api:${TAG}\` (see Docker Publish workflow)

          ## Notes
          See commit history and prior RELEASE notes for detailed changes.
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          fi
