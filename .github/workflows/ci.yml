name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-compile:
    name: Backend lint & compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package (dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile all application modules
        run: python -m compileall -q app
      - name: Import application package
        run: python -c "import app; print('app package importable')"

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
          POSTGRES_DB: personal_twin
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U twin -d personal_twin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package (dev)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Initialize application database schema
        env:
          APP_ENV: dev
          SHACL_MODE: warn
          DATABASE_URL: postgresql+psycopg://twin:twin@127.0.0.1:5434/personal_twin
        run: python -c "from app.main import bootstrap_schema; bootstrap_schema()"
      - name: Run unit tests
        env:
          APP_ENV: dev
          SHACL_MODE: warn
          DATABASE_URL: postgresql+psycopg://twin:twin@127.0.0.1:5434/personal_twin
        run: >-
          python -m pytest -q
          --ignore=tests/test_database_connector_integration.py
          --ignore=tests/test_ontology_ingestion_namespace_integration.py
          -k "not integration"

  web-static:
    name: Web static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate ontology studio scripts (if present)
        run: |
          set -e
          if [ -f web/ontology-studio/validate.mjs ]; then node web/ontology-studio/validate.mjs; fi
          if [ -f web/ontology-app-studio/validate.mjs ]; then node web/ontology-app-studio/validate.mjs; fi
      - name: Basic HTML presence checks
        run: |
          test -f web/index.html
          if grep -q 'id="v-cognition"' web/index.html; then
            echo "ERROR: cognition section still present in web/index.html"
            exit 1
          fi
